services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BUILD_APP_PATH=/app
        - BUILD_USER_NAME=django_user
    image: piprock/testy-django-app:latest
    container_name: testy-django-app
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    env_file:
      - .env